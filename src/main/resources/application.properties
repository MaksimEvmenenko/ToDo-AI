spring.application.name=todo-ai

# AWS Configuration
aws.region=us-east-1
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.table.todo=todos

# DynamoDB Configuration
spring.dynamodb.endpoint=http://localhost:8000
spring.dynamodb.region=us-east-1

# Server Configuration
server.servlet.context-path=/api
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.todoai=DEBUG
logging.level.software.amazon=WARN

