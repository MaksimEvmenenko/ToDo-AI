spring.application.name=todo-ai

# AWS Configuration
aws.region=us-east-1
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.table.todo=todos

# DynamoDB Configuration
spring.dynamodb.endpoint=http://localhost:8000
spring.dynamodb.region=us-east-1

# Server Configuration
server.servlet.context-path=/api
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.todoai=DEBUG
logging.level.software.amazon=WARN

# Reminder Configuration
reminder.notification.endpoint=http://localhost:8080/api/v1/notification/send
reminder.check.interval=60000

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-min-32-characters-required
jwt.expiration=3600000
jwt.refresh-expiration=86400000


